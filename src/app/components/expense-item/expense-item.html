<div class="card h-100" [style.borderLeft]="'4px solid ' + getCategoryColor(expense.category)">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h5 class="card-title">{{ expense.title }}</h5>
        <span class="badge" [style.backgroundColor]="getCategoryColor(expense.category)">
          {{ expense.category }}
        </span>
      </div>
      <div>
        <button class="btn btn-sm btn-outline-primary me-2" (click)="onEdit()">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="onDelete()">Delete</button>
      </div>
    </div>
    <h4 class="mt-3" [ngClass]="getAmountClass()">$ {{ expense.amount | number: '1.2-2' }}</h4>
  </div>
</div>
