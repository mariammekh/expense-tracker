<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>All Expenses</h2>
    <a routerLink="/add" class="btn btn-primary">+ Add New Expense</a>
  </div>

    <div *ngIf="expenses().length === 0" class="alert alert-info">
      No expenses found. Add some expenses to get started!
    </div>

    <div *ngIf="expenses().length > 0" class="row">
      <div class="col-md-6 col-lg-4 mb-3" *ngFor="let expense of expenses()">
        <app-expense-item [expense]="expense"></app-expense-item>
      </div>
    </div>
