<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-warning">
          <h4 class="mb-0">Edit Expense</h4>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input
                type="text"
                class="form-control"
                id="title"
                [(ngModel)]="title"
                name="title"
                required
              />
            </div>
            <div class="mb-3">
              <label for="amount" class="form-label">Amount ($)</label>
              <input
                type="number"
                class="form-control"
                id="amount"
                [(ngModel)]="amount"
                name="amount"
                step="0.01"
                required
              />
            </div>
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select class="form-select" id="category" [(ngModel)]="category" name="category">
                <option *ngFor="let cat of categories()" [value]="cat">{{ cat }}</option>
              </select>
            </div>
            <button type="submit" class="btn btn-warning">Update Expense</button>
            <a routerLink="/expenses" class="btn btn-secondary ms-2">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
